<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fa"><meta name="description" content="具身智能面试练习台 · VLA、Agentic Robotics 与 World Action Model">
  <title>具身研习室 · Embodied Prep</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%232d6854'/%3E%3Cpath d='M12 13h16v14H12zM16 9v4m8-4v4M16 19h1m6 0h1m-8 5h8' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="career.css"><link rel="stylesheet" href="community.css"><script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <aside class="sidebar">
    <a href="#" class="brand" aria-label="具身研习室首页"><span class="brand-mark" aria-hidden="true">⌘</span><span>具身研习室<small>EMBODIED PREP</small></span></a>
    <div class="workspace-label">个人学习空间 <span>LOCAL</span></div>
    <nav aria-label="主导航" id="navigation">
      <button data-view="bank" class="nav active"><span data-icon="grid"></span>题库广场<span class="nav-count" id="all-count">—</span></button>
      <button data-view="review" class="nav"><span data-icon="repeat"></span>待复习<span class="nav-count" id="review-count">0</span></button>
      <button data-view="saved" class="nav"><span data-icon="bookmark"></span>我的收藏<span class="nav-count" id="saved-count">0</span></button>
      <button data-view="companies" class="nav"><span data-icon="building"></span>目标公司</button>
      <button data-view="career" class="nav"><span data-icon="book"></span>求职情报</button>
      <button data-view="community" class="nav"><span data-icon="plus"></span>社区共建</button>
      <button data-view="roadmap" class="nav"><span data-icon="route"></span>学习路线</button>
    </nav>
    <div class="sidebar-note"><span class="eyebrow">LEARN. BUILD. EMBODY.</span><p>从理解一个模型，<br>到讲清一个系统。</p><div class="mini-orbit" aria-hidden="true"><i></i><i></i><i></i><b>π</b></div></div>
    <div class="sidebar-bottom"><span class="local-dot"></span><span>仅保存在当前浏览器<small>定期导出，留住学习记录</small></span><button id="backup" class="icon-button" title="导出题库与学习记录" aria-label="导出题库与学习记录"><span data-icon="download"></span></button></div>
  </aside>
  <div class="shell">
    <header class="topbar"><span id="breadcrumb">学习空间 <span class="slash">/</span> 题库广场</span><div class="top-actions"><span class="private-label"><span class="local-dot"></span>本地自用</span><button class="button small" id="restore"><span data-icon="upload"></span>导入备份</button><button class="button small dark" id="add-question"><span data-icon="plus"></span>录入个人题目</button></div></header>
    <main id="main" tabindex="-1"><div class="loading">正在打开你的研习室…</div></main>
    <footer>具身研习室 <span>·</span> 独立整理的学习工具，非公司官方题库 <span>·</span> 来源与审阅时间见各条目</footer>
  </div>
  <input type="file" id="backup-file" accept=".json,application/json" hidden>
  <dialog id="question-dialog" aria-labelledby="dialog-title">
    <form id="question-form">
      <div class="dialog-head"><div><span class="eyebrow">BUILD YOUR QUESTION BANK</span><h2 id="dialog-title">录入一段面经</h2></div><button type="button" class="icon-button" id="close-dialog" aria-label="关闭">✕</button></div>
      <p class="muted">保存到当前浏览器的个人题库。分享给社区时，请使用题目页的“贡献题目”入口。</p>
      <div class="form-grid"><label>公司<input name="company" list="company-options" required maxlength="80" placeholder="例如：星海图"></label><label>岗位<input name="role" list="role-options" required maxlength="100" value="具身算法工程师"></label></div>
      <div class="form-grid"><label>技术方向<select name="track"><option>VLA</option><option>Agentic Robotics</option><option>WAM</option><option>基础与工程</option></select></label><label>来源类型<select name="sourceKind"><option value="recollection">面经回忆（未经公司证实）</option><option value="practice">专项练习</option></select></label></div>
      <label>练习专题<select name="topic"><option value="all">通用 / 未分类</option><option>预训练</option></select></label>
      <label>题目<textarea name="title" rows="3" required maxlength="1200" placeholder="输入一道完整题目。请勿一次粘贴多道。"></textarea></label>
      <label>原文链接（选填）<input name="sourceUrl" type="url" maxlength="2000" placeholder="https://…"></label>
      <div class="form-grid"><label>答案性质<select name="kind"><option value="open">开放讨论 · 提供思路</option><option value="definite">明确结论 · 说明适用条件</option><option value="pending">暂未整理</option></select></label><label>难度<select name="difficulty"><option>进阶</option><option>基础</option><option>深入</option></select></label></div>
      <label>参考答案 / 回答思路（选填）<textarea name="answer" rows="4" maxlength="16000" placeholder="填写已核实的结论，或分析问题的步骤。留空则标记为待整理，不会自动编造答案。"></textarea></label>
      <label>学习步骤（选填，每行一步）<textarea name="steps" rows="2" maxlength="6000" placeholder="读哪篇论文，做什么实验，如何验证…"></textarea></label>
      <label>答案依据链接（选填）<input name="referenceUrl" type="url" maxlength="2000" placeholder="论文 / 官方文档 URL"></label>
      <p id="form-error" role="alert" class="error"></p><div class="dialog-actions"><button type="button" id="cancel-dialog" class="button">取消</button><button type="submit" class="button primary">保存到个人题库</button></div>
    </form>
  </dialog>
  <datalist id="company-options"></datalist><datalist id="role-options"><option value="具身算法工程师"><option value="机器人学习研究员"><option value="具身智能算法实习生"></datalist>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>请开启 JavaScript 后使用本地题库。</noscript>
</body>
</html>
